<div id="{{ modal_id }}" class="modal-backdrop" data-modal hidden>
  <section class="modal {{ modal_class }}" role="dialog" aria-modal="true" aria-labelledby="{{ modal_id }}-title">
    <div class="modal-head">
      <div>
        {% if kicker %}<div class="modal-kicker">{{ kicker }}</div>{% endif %}
        <h3 id="{{ modal_id }}-title">{{ title }}</h3>
      </div>
      <button class="icon-btn" type="button" data-modal-close aria-label="Fermer">
        <span class="vi" data-icon="X" data-icon-size="16"></span>
      </button>
    </div>
    <div class="modal-body {{ body_class }}">{{ body }}</div>
  </section>
</div>
